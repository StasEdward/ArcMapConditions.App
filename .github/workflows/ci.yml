name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        run: dotnet build ArcMapConditions.App.sln -c Release

      - name: Verify parser & subscriptions (smoke test)
        run: dotnet run --project tests/ParserSmokeTest -c Release
