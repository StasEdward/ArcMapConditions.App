name: Release

# Publishes a ready-to-run Windows build to a GitHub Release.
# Trigger by pushing a version tag (git tag v1.0.0 && git push origin v1.0.0),
# or run manually from the Actions tab (workflow_dispatch) with a tag input.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify parser & subscriptions (smoke test)
        run: dotnet run --project tests/ParserSmokeTest -c Release

      - name: Publish self-contained single-file (win-x64)
        run: >
          dotnet publish src/ArcMapConditions.App
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Package into a zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ArcMapConditions-win-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: >
          gh release create $env:TAG ArcMapConditions-win-x64.zip
          --title "ArcMapConditions $env:TAG"
          --generate-notes
